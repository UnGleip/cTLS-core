[package]
name = "ctls-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ctls"
path = "src/main.rs"

[dependencies]
ctls-core.workspace = true
ctls-platform.workspace = true
ctls-scanner.workspace = true
ctls-vault.workspace = true
ctls-repo.workspace = true
ctls-enforce.workspace = true
ctls-sync.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
time.workspace = true

[target.'cfg(windows)'.dependencies]
ctls-platform-win.workspace = true
windows = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_Foundation",
] }
